
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早餐店任務抽抽樂</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 16px;
  font-family: "Microsoft JhengHei", sans-serif;
  background: #fff8e9;
  color: #493525;
  text-align: center;
}

.container {
  max-width: 520px;
  margin: 25px auto;
  padding: 25px 20px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 5px 20px #00000012;
}

h1 { color: #b66a32; }

.subtitle {
  color: #8b7968;
  margin-bottom: 25px;
}

.result {
  min-height: 140px;
  padding: 25px 12px;
  margin: 20px 0;
  border: 2px dashed #e5b77c;
  border-radius: 15px;
  background: #fffaf2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  font-weight: bold;
  line-height: 1.6;
}

button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
  background: #bd783f;
  color: white;
}

button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.secondary { background: #7d9b79; }
.danger { background: #b85c50; }

input {
  width: 65%;
  padding: 12px;
  border: 1px solid #d8c6b2;
  border-radius: 10px;
  font-size: 16px;
}

ul {
  padding: 0;
  list-style: none;
  text-align: left;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding: 9px;
  border-bottom: 1px solid #eee5da;
}

li span {
  flex: 1;
  line-height: 1.5;
}

li button {
  padding: 6px 10px;
  font-size: 13px;
}

.info {
  color: #8b7968;
  font-size: 14px;
}

#status {
  font-size: 13px;
  color: #7d9b79;
  margin: 12px;
}

</style>
</head>

<body>

<div class="container">

  <h1> 早餐店任務抽抽樂</h1>

  <div class="subtitle">
    看看今天誰會抽到有趣任務！
  </div>

  <div id="status">正在連接雲端資料庫……</div>

  <div class="result" id="result">
    等待連線成功……
  </div>

  <button id="drawButton" onclick="drawTask()" disabled>
    🎲 抽取任務
  </button>

  <p class="info" id="count">載入中……</p>

  <hr style="border:0;border-top:1px solid #eee5da;margin:25px 0;">

  <h3> 共用任務管理</h3>

  <input
    id="newTask"
    type="text"
    placeholder="輸入新任務"
    onkeydown="if(event.key==='Enter') addTask()"
  >

  <button id="addButton" onclick="addTask()" disabled>
    新增
  </button>

  <ul id="taskList"></ul>

</div>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  runTransaction
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

// Firebase 網頁設定
const firebaseConfig = {
  apiKey: "AIzaSyAHECFLulPrlghpg89lFKNcrUA6FPmrfFA",
  authDomain: "breakfast-draw-shared.firebaseapp.com",
  projectId: "breakfast-draw-shared",
  storageBucket: "breakfast-draw-shared.firebasestorage.app",
  messagingSenderId: "1013622556420",
  appId: "1:1013622556420:web:74a7b45cb987593eeff251",
  measurementId: "G-GHZ1HSR95P"
};

// 預設任務
const defaultTasks = [
  "影帝附身：用表情演出自己吃到美食的感受",
  "空氣演奏家：假裝自己正在演奏樂器 10 秒",
  "頒獎典禮：假裝自己獲得早餐界年度最佳吃貨獎",
  "左右手互換：接下來使用非慣用手拿餐具",
  "快問快答：10 秒內說出 5 種早餐店食物",
  "聯想大師：10 秒內說出 5 種紅色的東西"
];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// 所有人共用同一份任務資料
const sharedRef = doc(db, "shared", "tasks");

let tasks = [];
let connected = false;

const statusElement = document.getElementById("status");
const resultElement = document.getElementById("result");
const drawButton = document.getElementById("drawButton");
const addButton = document.getElementById("addButton");

// 更新狀態
function setStatus(message) {
  statusElement.textContent = message;
}

// 初始化雲端任務資料
async function initializeTasks() {
  await runTransaction(db, async (transaction) => {
    const snapshot = await transaction.get(sharedRef);

    if (!snapshot.exists()) {
      transaction.set(sharedRef, {
        tasks: defaultTasks
      });
    }
  });
}

// 即時監聽雲端任務
function listenTasks() {
  onSnapshot(sharedRef, (snapshot) => {

    if (snapshot.exists()) {
      const data = snapshot.data();
      tasks = Array.isArray(data.tasks) ? data.tasks : [];
    } else {
      tasks = [];
    }

    connected = true;

    setStatus("🟢 雲端同步中，任務清單已連線");

    drawButton.disabled = false;
    addButton.disabled = false;

    updateDisplay();

  }, (error) => {

    setStatus("連線失敗：" + error.message);

  });
}

// 隨機抽取，每個人獨立
window.drawTask = function() {

  if (tasks.length === 0) {
    resultElement.textContent = "目前沒有任務，請先新增！";
    return;
  }

  const index = Math.floor(Math.random() * tasks.length);

  resultElement.textContent = tasks[index];
};

// 新增任務到雲端
window.addTask = async function() {

  const input = document.getElementById("newTask");
  const task = input.value.trim();

  if (!task) {
    alert("請先輸入任務！");
    return;
  }

  if (tasks.includes(task)) {
    alert("這個任務已經存在！");
    return;
  }

  addButton.disabled = true;

  try {

    await runTransaction(db, async (transaction) => {

      const snapshot = await transaction.get(sharedRef);

      if (!snapshot.exists()) {
        throw new Error("任務資料不存在，請重新整理網頁");
      }

      const currentTasks = snapshot.data().tasks || [];

      if (currentTasks.includes(task)) {
        throw new Error("這個任務已經存在！");
      }

      transaction.update(sharedRef, {
        tasks: [...currentTasks, task]
      });

    });

    input.value = "";

  } catch (error) {

    alert("新增失敗：" + error.message);

  } finally {

    addButton.disabled = !connected;

  }
};

// 從雲端刪除任務
window.deleteTask = async function(task) {

  if (!confirm("確定要刪除這個任務嗎？所有人的清單都會同步更新。")) {
    return;
  }

  try {

    await runTransaction(db, async (transaction) => {

      const snapshot = await transaction.get(sharedRef);

      if (!snapshot.exists()) return;

      const currentTasks = snapshot.data().tasks || [];

      transaction.update(sharedRef, {
        tasks: currentTasks.filter(t => t !== task)
      });

    });

  } catch (error) {

    alert("刪除失敗：" + error.message);

  }

};

// 更新任務清單畫面
function updateDisplay() {

  document.getElementById("count").textContent =
    `目前共有 ${tasks.length} 個任務，可以無限抽取！`;

  const list = document.getElementById("taskList");

  list.innerHTML = "";

  tasks.forEach(task => {

    const li = document.createElement("li");

    const span = document.createElement("span");
    span.textContent = task;

    const button = document.createElement("button");
    button.className = "danger";
    button.textContent = "刪除";
    button.onclick = () => deleteTask(task);

    li.appendChild(span);
    li.appendChild(button);

    list.appendChild(li);

  });

}

// 啟動匿名登入
try {

  await signInAnonymously(auth);

  await initializeTasks();

  listenTasks();

} catch (error) {

  setStatus("連線失敗：" + error.message);

  resultElement.textContent =
    "無法連接資料庫，請檢查 Firebase 設定。";

}

</script>

</body>
</html>
